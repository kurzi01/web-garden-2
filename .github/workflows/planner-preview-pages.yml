name: Planner Preview Artifact

on:
  push:
    branches:
      - work/migration
    paths:
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload standalone planner preview
        uses: actions/upload-artifact@v4
        with:
          name: moj-ogrod-planner-preview
          path: ./preview
          if-no-files-found: error
